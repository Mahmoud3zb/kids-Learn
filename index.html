<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&family=Cairo:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
            padding: 24px 16px;
            color: #0f172a;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 680px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 32px 24px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }

        .img-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 14px;
            background: #fff;
        }

        .img-wrapper img {
            max-width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            border-radius: 12px;
        }

        .demo-badge {
            margin-top: 28px;
            display: inline-block;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ef4444;
            background-color: #fef2f2;
            border: 2px dashed #f87171;
            padding: 10px 28px;
            border-radius: 9999px;
            user-select: none;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.15);
            animation: pulse 2.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.03);
                opacity: 0.9;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 14px;
            }
            .demo-badge {
                font-size: 1.15rem;
                padding: 8px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="img-wrapper">
            <img src="demo.png" alt="Demo Image">
        </div>
        <div class="demo-badge">
            just a demo
        </div>
    </div>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أبطال الحروف 🌟 | مس أسماء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f80e1;
      --primary-light: #eaf1ff;
      --accent-gold: #ffbe3d;
      --accent-mint: #38c88f;
      --accent-pink: #ff6584;
      --accent-purple: #8f6cf7;
      --navy: #1f2d47;
      --text-sub: #63718d;
      --bg: #f5f8ff;
      --card-bg: #ffffff;
      --border-subtle: #e5ebf8;
      --shadow-sm: 0 4px 12px rgba(31, 45, 71, 0.05);
      --shadow-md: 0 10px 28px rgba(45, 74, 133, 0.08);
      --shadow-hover: 0 16px 36px rgba(45, 74, 133, 0.14);
      --radius-lg: 26px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background: var(--bg);
      background-image: 
        radial-gradient(#dce7ff 1.2px, transparent 1.2px), 
        radial-gradient(#ffe6ed 1.2px, var(--bg) 1.2px);
      background-size: 36px 36px;
      background-position: 0 0, 18px 18px;
      color: var(--navy);
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    button, input, select { font-family: inherit; }
    button { cursor: pointer; border: 0; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    button:active { transform: scale(0.96); }

    /* Top Navigation */
    .header-bar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 2px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(31, 45, 71, 0.03);
    }
    .header-content {
      max-width: 1180px;
      margin: auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, #70a1ff, #ff758c);
      display: grid;
      place-items: center;
      font-size: 26px;
      box-shadow: 0 6px 16px rgba(112, 161, 255, 0.35);
      animation: gentle-tilt 4s ease-in-out infinite alternate;
    }
    @keyframes gentle-tilt {
      from { transform: rotate(-4deg); }
      to { transform: rotate(4deg); }
    }
    .brand-title {
      font-size: 20px;
      font-weight: 900;
      color: var(--navy);
      line-height: 1.2;
    }
    .brand-sub {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-pink);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 14.5px;
      box-shadow: 0 6px 16px rgba(79, 128, 225, 0.28);
    }
    .btn:hover {
      box-shadow: 0 8px 22px rgba(79, 128, 225, 0.38);
      transform: translateY(-2px);
    }
    .btn-green {
      background: var(--accent-mint);
      box-shadow: 0 6px 16px rgba(56, 200, 143, 0.28);
    }
    .btn-green:hover {
      box-shadow: 0 8px 22px rgba(56, 200, 143, 0.38);
    }
    .btn-pink {
      background: var(--accent-pink);
      box-shadow: 0 6px 16px rgba(255, 101, 132, 0.28);
    }
    .btn-soft {
      background: var(--primary-light);
      color: var(--primary);
      box-shadow: none;
    }
    .btn-soft:hover {
      background: #dbe7ff;
      transform: translateY(-1px);
    }
    .btn-light {
      background: white;
      color: var(--text-sub);
      border: 1.5px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
    }
    .btn-light:hover {
      border-color: #cbd7f0;
      color: var(--navy);
    }
    .btn-icon {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 12px;
      font-size: 18px;
    }

    /* Main Container */
    .container {
      max-width: 1180px;
      margin: 24px auto 60px;
      padding: 0 20px;
    }

    /* Hero Banner */
    .hero-card {
      padding: 28px 34px;
      border-radius: var(--radius-lg);
      background: linear-gradient(125deg, #eef5ff 0%, #f4efff 50%, #fff1f4 100%);
      border: 2px solid white;
      box-shadow: var(--shadow-md);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      top: -30%;
      right: 40%;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(255,220,135,0.4) 0%, transparent 70%);
      pointer-events: none;
    }
    .hero-info h1 {
      font-size: clamp(24px, 4vw, 36px);
      margin: 0 0 8px;
      font-weight: 900;
      color: var(--navy);
    }
    .hero-info p {
      margin: 0 0 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.7;
      max-width: 580px;
    }
    .hero-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
    }
    .hero-art-side {
      font-size: 80px;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      user-select: none;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,0.06));
    }
    .floating-mascot {
      animation: float-mascot 3.5s ease-in-out infinite alternate;
    }
    @keyframes float-mascot {
      from { transform: translateY(0px) rotate(0deg); }
      to { transform: translateY(-10px) rotate(3deg); }
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 20px;
      margin-top: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.25s ease;
    }
    .card:hover {
      box-shadow: var(--shadow-md);
    }
    .s-12 { grid-column: span 12; }
    .s-8  { grid-column: span 8; }
    .s-6  { grid-column: span 6; }
    .s-4  { grid-column: span 4; }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .card-title {
      font-size: 19px;
      font-weight: 800;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Progress bar */
    .progress-track {
      height: 14px;
      border-radius: 50px;
      background: #ecf1fc;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      border-radius: 50px;
      background: linear-gradient(90deg, var(--accent-mint), #56dfaa);
      transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 12px rgba(56, 200, 143, 0.4);
    }

    /* Level Cards */
    .level-boxes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }
    .level-box {
      padding: 16px;
      border-radius: var(--radius-md);
      background: #f6f9ff;
      border: 1.5px solid #e7eeff;
      text-align: center;
      transition: transform 0.2s;
    }
    .level-box.active {
      background: #edf5ff;
      border-color: #bcd5ff;
      box-shadow: 0 4px 14px rgba(79, 128, 225, 0.1);
    }
    .level-box.locked {
      background: #f7f8fa;
      border-color: #eaebf0;
      opacity: 0.65;
    }
    .level-box b {
      display: block;
      margin: 6px 0 3px;
      font-size: 15px;
    }
    .level-box small {
      font-size: 11.5px;
      color: var(--text-sub);
    }

    /* Letters Grid */
    .letters-shelf {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }
    .letter-btn {
      position: relative;
      background: white;
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 8px 12px;
      text-align: center;
      color: var(--navy);
      box-shadow: 0 4px 10px rgba(31, 45, 71, 0.03);
      cursor: pointer;
      overflow: hidden;
    }
    .letter-btn:hover:not(.locked) {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(79, 128, 225, 0.16);
    }
    .letter-btn .char-display {
      font-family: 'Fredoka', 'Cairo', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      display: block;
    }
    .letter-btn .status-text {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-sub);
      margin-top: 6px;
      display: block;
    }
    .letter-btn.done {
      background: #f1fbf6;
      border-color: #b7e8d2;
    }
    .letter-btn.done .char-display {
      color: var(--accent-mint);
    }
    .letter-btn.done .status-text {
      color: #219665;
    }
    .letter-btn.locked {
      background: #f8f9fb;
      border-color: #eaecf1;
      opacity: 0.6;
      cursor: pointer;
    }
    .letter-btn.locked .char-display {
      color: #9ea8bc;
    }
    .letter-btn.current {
      border-color: var(--accent-gold);
      background: #fffdf5;
      animation: pulse-border 2.5s infinite;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: var(--accent-gold); box-shadow: 0 0 0 0 rgba(255, 190, 61, 0.4); }
      50% { border-color: #ffa800; box-shadow: 0 0 0 6px rgba(255, 190, 61, 0.2); }
    }

    /* Tasks Row */
    .task-item {
      display: flex;
      align-items: center;
      gap: 14px;
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      margin-bottom: 12px;
      background: white;
      transition: all 0.2s ease;
    }
    .task-item:hover {
      border-color: #cbd8f2;
      background: #fafcff;
      transform: translateX(-4px);
    }
    .task-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f0f4ff;
      display: grid;
      place-items: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .task-info {
      flex: 1;
      min-width: 0;
    }
    .task-info strong {
      font-size: 15px;
      color: var(--navy);
      display: block;
      margin-bottom: 2px;
    }
    .task-info small {
      color: var(--text-sub);
      font-size: 12.5px;
    }
    .tag-badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 800;
      background: #eef6ff;
      color: var(--primary);
    }
    .tag-badge.done {
      background: #e9faf2;
      color: #219665;
    }

    /* Lesson Workspace */
    .lesson-container {
      max-width: 880px;
      margin: 10px auto 30px;
    }
    .lesson-card {
      background: white;
      border: 2px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .nav-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px 2px 14px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-pill {
      white-space: nowrap;
      padding: 10px 18px;
      border-radius: 30px;
      background: white;
      border: 1.5px solid var(--border-subtle);
      color: var(--text-sub);
      font-weight: 800;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .tab-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 4px 14px rgba(79, 128, 225, 0.35);
    }

    /* Big Character Card */
    .big-char-card {
      padding: 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #f0f6ff, #fcf9ff);
      border: 2px dashed #c9daf8;
      margin: 16px 0 24px;
      position: relative;
    }
    .big-letter-text {
      font-family: 'Fredoka', 'Cairo', sans-serif;
      font-size: clamp(80px, 16vw, 130px);
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
      margin: 10px 0;
      text-shadow: 0 8px 18px rgba(79, 128, 225, 0.2);
    }

    /* Flashcards */
    .flashcards-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 20px 0;
    }
    .flashcard {
      background: white;
      border: 2px solid var(--border-subtle);
      border-radius: 20px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .flashcard:hover {
      border-color: var(--accent-mint);
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(56, 200, 143, 0.15);
    }
    .flashcard-icon {
      font-size: 48px;
      margin-bottom: 8px;
      display: inline-block;
      transition: transform 0.2s;
    }
    .flashcard:hover .flashcard-icon {
      transform: scale(1.15);
    }
    .flashcard-en {
      font-family: 'Fredoka', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 2px;
    }
    .flashcard-ar {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .flashcard-audio-hint {
      position: absolute;
      top: 8px;
      left: 8px;
      font-size: 12px;
      background: #f0f4ff;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: var(--primary);
    }

    /* Tracing Pad */
    .trace-wrapper {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 270px;
      margin: 20px auto;
      border-radius: 24px;
      background: #fafcff;
      border: 3px dashed #b9d0fa;
      overflow: hidden;
      touch-action: none;
      box-shadow: inset 0 2px 10px rgba(79, 128, 225, 0.05);
    }
    .trace-guide-char {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 180px;
      font-weight: 700;
      color: #e2ecff;
      user-select: none;
      pointer-events: none;
      line-height: 1;
    }
    .trace-dot-start {
      position: absolute;
      top: 36px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent-mint);
      border: 3px solid white;
      box-shadow: 0 0 0 4px rgba(56, 200, 143, 0.4);
      animation: pulse-dot 1.8s infinite;
      z-index: 2;
      pointer-events: none;
    }
    @keyframes pulse-dot {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.25); }
    }
    .trace-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      z-index: 3;
    }

    /* Multiple Choices */
    .quiz-options {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin: 24px 0;
    }
    .quiz-btn {
      width: 95px;
      height: 95px;
      border-radius: 24px;
      background: white;
      border: 3px solid var(--border-subtle);
      font-family: 'Fredoka', 'Cairo', sans-serif;
      font-size: 42px;
      font-weight: 700;
      color: var(--primary);
      box-shadow: 0 6px 16px rgba(31, 45, 71, 0.06);
    }
    .quiz-btn:hover {
      border-color: var(--accent-mint);
      background: #f1fbf6;
      transform: scale(1.08);
    }

    /* Word Builder Game */
    .word-slot-box {
      font-family: 'Fredoka', sans-serif;
      font-size: 52px;
      font-weight: 700;
      letter-spacing: 8px;
      color: var(--navy);
      background: #f6f9ff;
      border: 2px solid #dae5f8;
      border-radius: 20px;
      padding: 16px 28px;
      display: inline-block;
      margin: 18px 0;
    }
    .word-slot-blank {
      color: var(--accent-pink);
      border-bottom: 4px solid var(--accent-pink);
      padding: 0 6px;
    }

    /* Coloring Pad */
    .palette-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 14px 0;
      flex-wrap: wrap;
    }
    .palette-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 2px #d2dbec;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .palette-dot:hover, .palette-dot.active {
      transform: scale(1.22);
      box-shadow: 0 0 0 3px var(--primary);
    }
    .stamp-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0 16px;
    }
    .stamp-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #f0f4ff;
      border: 1.5px solid #dce5f8;
      font-size: 20px;
      display: grid;
      place-items: center;
    }
    .stamp-btn.active {
      border-color: var(--accent-pink);
      background: #fff0f3;
      transform: scale(1.15);
    }

    /* Teacher Dashboard Styles */
    .teacher-stat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 22px;
    }
    .teacher-stat-card {
      background: #f7faff;
      border: 1.5px solid #e2edff;
      border-radius: var(--radius-md);
      padding: 18px 14px;
      text-align: center;
    }
    .teacher-stat-card .val {
      font-size: 30px;
      font-weight: 900;
      color: var(--navy);
      display: block;
      margin-top: 4px;
    }
    .teacher-stat-card .lbl {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
    }

    .kid-row-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background: white;
      border: 1.5px solid var(--border-subtle);
      margin-bottom: 12px;
    }
    .kid-avatar {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #ffebe3;
      display: grid;
      place-items: center;
      font-size: 26px;
      flex-shrink: 0;
    }

    /* Custom Kid-Friendly Alert Modal (Replaces browser alert) */
    .kid-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(23, 33, 53, 0.6);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .kid-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .kid-modal-card {
      background: white;
      border-radius: 32px;
      padding: 32px 28px 26px;
      width: min(440px, 100%);
      text-align: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(23, 33, 53, 0.25);
      border: 3px solid white;
      transform: scale(0.88);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .kid-modal-overlay.active .kid-modal-card {
      transform: scale(1);
    }
    .kid-modal-mascot {
      width: 90px;
      height: 90px;
      margin: -75px auto 14px;
      border-radius: 28px;
      background: linear-gradient(135deg, #ffeaa7, #fab1a0);
      display: grid;
      place-items: center;
      font-size: 48px;
      box-shadow: 0 12px 28px rgba(250, 177, 160, 0.45);
      border: 4px solid white;
      animation: pop-bounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes pop-bounce {
      0% { transform: scale(0.3) rotate(-15deg); }

  <script>
    /* ==========================================================================
       1. DATA & STATE MANAGEMENT (Local Storage persistence)
       ========================================================================== */
    const STORAGE_KEY = 'KIDS_HEROES_ASMAA_DATA_v2';

    // Rich Letter Content Database (Phonics, Words, Icons, Translations)
    const LETTER_DATA = {

          { en: 'Duck', ar: 'بطة', icon: '🦆' },
          { en: 'Door', ar: 'باب', icon: '🚪' }
        ],
        quizWord: { word: 'DOG', missing: 'D', display: '_OG', icon: '🐶', choices: ['D', 'B', 'T'] }
      },

      },

        words: [
          { en: 'Fish', ar: 'سمكة', icon: '🐟' },

        ],
        quizWord: { word: 'FISH', missing: 'F', display: '_ISH', icon: '🐟', choices: ['F', 'P', 'V'] }
      }
    };

    // Fallback generator for remaining letters G-Z
    const ALPHABET = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    ALPHABET.forEach(letter => {
      if (!LETTER_DATA[letter]) {
        LETTER_DATA[letter] = {
          char: letter,
          phonics: `صوت الحرف ${letter}`,
          words: [
            { en: `Word ${letter}`, ar: `كلمة بحرف ${letter}`, icon: '🌟' },
            { en: `Super ${letter}`, ar: `بطل ${letter}`, icon: '🚀' },
            { en: `Happy ${letter}`, ar: `مرح ${letter}`, icon: '🎈' }
          ],
          quizWord: { word: `${letter}STAR`, missing: letter, display: `_${letter}TAR`, icon: '🌟', choices: [letter, 'A', 'S'] }
        };
      }
    });

    // Default Seed State
    const defaultState = {
      role: 'child', // 'child' | 'teacher'
      currentStudentId: 'adam01',
      activeLetter: 'A',
      activeLessonTab: 'all',
      passThreshold: 70, // Teacher configured passing threshold %
      customActivities: [],
      brushColor: '#ff6584',
      brushStamp: null,
      students: [
        {
          id: 'adam01',
          name: 'آدم',
          avatar: '🦁',
          stars: 12,
          progress: { A: 85, B: 50, C: 0 },
          unlocked: ['A', 'B']
        },
        {
          id: 'laila02',
          name: 'ليلى',
          avatar: '🌸',
          stars: 18,
          progress: { A: 100, B: 80, C: 40 },
          unlocked: ['A', 'B', 'C']
        },
        {
          id: 'yassin03',
          name: 'ياسين',
          avatar: '🚀',
          stars: 9,
          progress: { A: 75, B: 20 },
          unlocked: ['A', 'B']
        },
        {
          id: 'mariam04',
          name: 'مريم',
          avatar: '🦄',
          stars: 15,
          progress: { A: 90, B: 70, C: 15 },
          unlocked: ['A', 'B', 'C']
        }
      ]
    };

    function loadState() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          return { ...defaultState, ...parsed };
        }
      } catch (e) {
        console.warn('Could not read saved state:', e);
      }
      return defaultState;
    }

    let state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('Could not save state:', e);
      }
    }

    function getCurrentStudent() {
      let st = state.students.find(s => s.id === state.currentStudentId);
      if (!st && state.students.length > 0) {
        st = state.students[0];
        state.currentStudentId = st.id;
      }
      return st;
    }

    /* ==========================================================================
       2. SOUND EFFECTS (Web Audio API - Offline & Reliable)
       ========================================================================== */
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playSound(type) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (type === 'celebrate' || type === 'star') {
          // Cheerful chime: C5, E5, G5, C6
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + i * 0.08);
            gain.gain.setValueAtTime(0.18, now + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.08);
            osc.stop(now + i * 0.08 + 0.36);
          });
        } else if (type === 'correct') {
          // Upbeat double ding
          [659.25, 880].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.1);
            gain.gain.setValueAtTime(0.2, now + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.1);
            osc.stop(now + i * 0.1 + 0.31);
          });
        } else if (type === 'wrong') {
          // Gentle "try again" soft boop
          [349.23, 293.66].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now + i * 0.12);
            gain.gain.setValueAtTime(0.15, now + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.12 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + i * 0.12);
            osc.stop(now + i * 0.12 + 0.26);
          });
        } else if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(700, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.09);
        } else if (type === 'lock') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, now);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }
      } catch (err) {
        console.warn('Audio play error:', err);
      }
    }

    // Speech Synthesis for English Phonics and Words (Gentle, slow Female Teacher Voice)
    let selectedFemaleVoice = null;

    function findBestFemaleVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || voices.length === 0) return null;

      const femaleKeywords = [
        'zira', 'jenny', 'aria', 'samantha', 'victoria', 'karen', 'female',
        'woman', 'sonia', 'libby', 'hazel', 'susan', 'catherine', 'ava', 'emma', 'olivia'
      ];

      // 1. Prioritize English female voice (Zira, Jenny, Samantha, etc.)
      let match = voices.find(v => 
        (v.lang.startsWith('en') || v.lang.startsWith('EN')) &&
        femaleKeywords.some(kw => v.name.toLowerCase().includes(kw))
      );

      // 2. English Natural / Online voice (often high-clarity female)
      if (!match) {
        match = voices.find(v => 
          (v.lang.startsWith('en') || v.lang.startsWith('EN')) && 
          (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Online'))
        );
      }

      // 3. Any English voice
      if (!match) {
        match = voices.find(v => v.lang.startsWith('en'));
      }

      return match || voices[0];
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        selectedFemaleVoice = findBestFemaleVoice();
      };
      selectedFemaleVoice = findBestFemaleVoice();
    }

    function speakText(text, lang = 'en-US') {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = lang;

          const voice = selectedFemaleVoice || findBestFemaleVoice();
          if (voice) {
            utterance.voice = voice;
          }

          // Slow, calm, and clearly articulated pace for kids
          utterance.rate = 0.65;
          // Gentle, warm female teacher pitch
          utterance.pitch = 1.18;
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.warn('Speech synthesis error:', e);
      }
    }

    /* ==========================================================================
       3. CONFETTI EFFECT (Celebration Animation)
       ========================================================================== */
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId = null;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti(count = 60) {
      const colors = ['#ff6584', '#ffbe3d', '#38c88f', '#4f80e1', '#8f6cf7', '#ff9ff3'];
      for (let i = 0; i < count; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 200,
          y: window.innerHeight / 2 - 80,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vRot: (Math.random() - 0.5) * 10,
          alpha: 1,
          shape: Math.random() > 0.5 ? 'rect' : 'circle'
        });
      }
      if (!confettiAnimationId) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // gravity
        p.rotation += p.vRot;
        p.alpha -= 0.012;

        if (p.alpha <= 0 || p.y > window.innerHeight) {
          confettiParticles.splice(i, 1);
          continue;
        }

        confettiCtx.save();
        confettiCtx.globalAlpha = p.alpha;
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate((p.rotation * Math.PI) / 180);
        confettiCtx.fillStyle = p.color;

        if (p.shape === 'rect') {
          confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        } else {
          confettiCtx.beginPath();
          confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
          confettiCtx.fill();
        }
        confettiCtx.restore();
      }

      if (confettiParticles.length > 0) {
        confettiAnimationId = requestAnimationFrame(animateConfetti);
      } else {
        confettiAnimationId = null;
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }
    }

    /* ==========================================================================
       4. CUSTOM KID-FRIENDLY ALERT & TOAST SYSTEM (NO BROWSER ALERT)
       ========================================================================== */
    let alertConfirmCallback = null;

    function showKidAlert(options) {
      // options: { title, desc, mascot, btnText, type, onConfirm }
      const modal = document.getElementById('kidAlertModal');
      const mascot = document.getElementById('alertMascot');
      const title = document.getElementById('alertTitle');
      const desc = document.getElementById('alertDesc');
      const confirmBtn = document.getElementById('alertConfirmBtn');

      mascot.textContent = options.mascot || '🌟';
      title.textContent = options.title || 'رائع!';
      desc.textContent = options.desc || '';
      confirmBtn.textContent = options.btnText || 'تمام يا مس أسماء! 🌸';

      // Type themes
      if (options.type === 'lock') {
        playSound('lock');
        mascot.style.background = 'linear-gradient(135deg, #e2e8f0, #cbd5e1)';
        confirmBtn.className = 'btn btn-soft';
      } else if (options.type === 'success' || options.type === 'star') {
        playSound('celebrate');
        launchConfetti(50);
        mascot.style.background = 'linear-gradient(135deg, #ffd36e, #ffaa00)';
        confirmBtn.className = 'btn btn-green';
      } else {
        playSound('click');
        mascot.style.background = 'linear-gradient(135deg, #85d4ff, #b5a3ff)';
        confirmBtn.className = 'btn btn-pink';
      }

      alertConfirmCallback = options.onConfirm || null;
      modal.classList.add('active');
    }

    function closeAlert() {
      const modal = document.getElementById('kidAlertModal');
      modal.classList.remove('active');
      playSound('click');
      if (alertConfirmCallback) {
        const cb = alertConfirmCallback;
        alertConfirmCallback = null;
        cb();
      }
    }

    function showToast(msg, icon = '✨') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');

      toastMsg.textContent = msg;
      toastIcon.textContent = icon;
      toast.classList.add('show');
      playSound('click');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 3200);
    }

    /* ==========================================================================
       5. GENERAL APPLICATION MODALS (Add Kid, Letter Manager, Rules)
       ========================================================================== */
    function openAppModal(title, htmlContent) {
      document.getElementById('appModalTitle').textContent = title;
      document.getElementById('appModalBody').innerHTML = htmlContent;
      document.getElementById('appModal').classList.add('active');
      playSound('click');
    }

    function closeAppModal() {
      document.getElementById('appModal').classList.remove('active');

    function recordActivityCompletion(activityName) {
      const st = getCurrentStudent();
      const l = state.activeLetter;
      const prevScore = st.progress[l] || 0;
      const newScore = Math.min(100, prevScore + 20);
      st.progress[l] = newScore;
      st.stars = (st.stars || 0) + 2;

      let unlockedNext = null;
      if (newScore >= state.passThreshold) {
        const nextChar = ALPHABET[ALPHABET.indexOf(l) + 1];
        if (nextChar && !st.unlocked.includes(nextChar)) {
          st.unlocked.push(nextChar);
          unlockedNext = nextChar;
        }
      }

      saveState();

      if (unlockedNext) {
        showKidAlert({
          title: `مبروك يا بطل! 🎉 فتحت حرف ${unlockedNext}!`,
          desc: `شطووور جداً يا ${st.name}! حققت نسبة ${newScore}% في حرف ${l}، ومس أسماء فخورة بيك! دلوقتي تقدر تبدأ رحلة حرف ${unlockedNext} 🚀`,
          mascot: '🏆',

          type: 'success',
          onConfirm: () => {

    /* ==========================================================================
       9. CANVAS INTERACTIVE DRAWING (TRACING & COLORING)
       ========================================================================== */
    function initTracingCanvas() {
      const canvas = document.getElementById('traceCanvas');
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = 14;
      ctx.strokeStyle = '#4f80e1';

      let isDrawing = false;
      let drawnPoints = 0;

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - r.left,
          y: clientY - r.top
        };
      }

      function startDraw(e) {
        isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        playSound('click');
        e.preventDefault();
      }

      function doDraw(e) {
        if (!isDrawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        drawnPoints++;
        e.preventDefault();
      }

      function endDraw() {
        if (isDrawing && drawnPoints > 25) {
          // Drawn enough to consider completed
        }
        isDrawing = false;
      }

      canvas.onpointerdown = startDraw;
      canvas.onpointermove = doDraw;
      canvas.onpointerup = endDraw;
      canvas.onpointerleave = endDraw;

      canvas.ontouchstart = startDraw;
      canvas.ontouchmove = doDraw;
      canvas.ontouchend = endDraw;
    }

    function clearTracingCanvas() {
      const canvas = document.getElementById('traceCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      playSound('click');
      showToast('مسحنا اللوحة! يلا ابدأ من النقطة الخضراء ✍️', '🌱');
    }

    function initColoringCanvas() {
      const canvas = document.getElementById('paintCanvas');
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      // Draw background letter stencil
      ctx.fillStyle = '#f8faff';
      ctx.fillRect(0, 0, rect.width, rect.height);
      ctx.font = 'bold 150px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#e2ecfc';
      ctx.fillText(state.activeLetter, rect.width / 2, rect.height / 2);

      let isDrawing = false;

      function getPos(e) {
        const r = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: clientX - r.left,
          y: clientY - r.top
        };
      }

      function startDraw(e) {
        const pos = getPos(e);
        if (state.brushStamp) {
          // Stamp mode!
          ctx.font = '36px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(state.brushStamp, pos.x, pos.y);
          playSound('click');
          e.preventDefault();
          return;
        }

        isDrawing = true;
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 18;
        ctx.strokeStyle = state.brushColor || '#ff6584';
        e.preventDefault();
      }

      function doDraw(e) {
        if (!isDrawing || state.brushStamp) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
      }

      function endDraw() {
        isDrawing = false;
      }

      canvas.onpointerdown = startDraw;
      canvas.onpointermove = doDraw;
      canvas.onpointerup = endDraw;
      canvas.onpointerleave = endDraw;
    }

    function selectColor(color, el) {

              <span style="color:var(--text-sub); font-size:13px; font-weight:700;">اضغط على أي حرف مفتوح للبدء</span>
            </div>
            <div class="letters-shelf">
              ${ALPHABET.slice(0, 12).map(char => {
                const score = st.progress[char] || 0;
                const isUnlocked = st.unlocked.includes(char);
                const isDone = score >= state.passThreshold;
                const isCurrent = isUnlocked && !isDone;

                return `
                  <button class="letter-btn ${isDone ? 'done' : ''} ${!isUnlocked ? 'locked' : ''} ${isCurrent ? 'current' : ''}"
                    onclick="openLetter('${char}')">
                    <span class="char-display">${char} ${char.toLowerCase()}</span>
                    <span class="status-text">
                      ${!isUnlocked ? '🔒 مقفول' : isDone ? '✓ متقن 100%' : score > 0 ? score + '% خلصت' : 'ابدأ الآن ✨'}
                    </span>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Tasks & Curriculum Breakdown -->
          <section class="card s-12">
            <div class="card-head">
              <h2 class="card-title">🧩 جدول الأنشطة مع مس أسماء</h2>
            </div>
            <div class="task-item">
              <div class="task-icon">🔊</div>
              <div class="task-info">
                <strong>نطق الحرف الفونكس (Phonics Sound)</strong>
                <small>الطفل بيسمع الصوت الطبيعي للحرف باللغة الإنجليزية ويكرره مع مس أسماء</small>
              </div>
              <span class="tag-badge done">تأسيس صوتي</span>
            </div>
            <div class="task-item">
              <div class="task-icon">✍️</div>
              <div class="task-info">
                <strong>تتبّع الحرف والكتابة الصحيحة (Letter Tracing)</strong>
                <small>لوحة رسم تفاعلية ترشد يد الطفل للاتجاه الصحيح لكتابة الحرف الكبير والصغير</small>
              </div>
              <span class="tag-badge">مهارات حركية</span>
            </div>
            <div class="task-item">
              <div class="task-icon">🎧</div>
              <div class="task-info">
                <strong>لعبة اسمع واختار (Listening Quiz)</strong>
                <small>تحدي تفاعلي لتمييز الحرف صوتياً وبصرياً بين الحروف المختلفة</small>
              </div>
              <span class="tag-badge">تحدي وذكاء</span>
            </div>
            <div class="task-item">
              <div class="task-icon">🎨</div>
              <div class="task-info">
                <strong>لوحة التلوين والملصقات (Coloring & Stickers)</strong>
                <small>تفريغ طاقة الطفل الإبداعية بتلوين الحرف وإضافة ستيكرات لطيفة</small>
              </div>
              <span class="tag-badge done">إبداع ومرح</span>
            </div>
          </section>
        </div>
      `;

      document.getElementById('appMount').innerHTML = html;
    }

    /* ---------------- Letter Workspace View ---------------- */
    function renderLetterWorkspace() {
      const char = state.activeLetter;
      const data = LETTER_DATA[char];
      const st = getCurrentStudent();
      const score = st.progress[char] || 0;

      const tabs = [
        { id: 'all', title: '📋 كل الأنشطة', icon: '📋' },
        { id: 'sound', title: '🔊 صوت الحرف وكلماته', icon: '🔊' },
        { id: 'trace', title: '✍️ تتبّع وكتابة', icon: '✍️' },
        { id: 'quiz', title: '🎧 اسمع واختار', icon: '🎧' },
        { id: 'word', title: '🧩 كوّن الكلمة', icon: '🧩' },
        { id: 'color', title: '🎨 لوّن وابدع', icon: '🎨' }
      ];

      const html = `
        <div class="lesson-container">
          <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
            <button class="btn btn-light" onclick="state.activeLessonTab = 'overview_home'; render();">
              ← رجوع للحروف
            </button>
            <div style="display:flex; align-items:center; gap:8px;">
              <span style="font-size:14px; font-weight:800; color:var(--text-sub);">المستوى الأول • حرف ${char}</span>
              <span class="tag-badge ${score >= state.passThreshold ? 'done' : ''}">${score}% إتقان</span>
            </div>
          </div>

          <div class="lesson-card">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
              <div style="text-align:right;">
                <h2 style="margin:0 0 4px; font-size:24px; font-weight:900;">
                  يلا نتعلم حرف ${char} ${char.toLowerCase()}! 🌈
                </h2>
                <div style="color:var(--text-sub); font-size:14px; font-weight:700;">
                  ${data.phonics}
                </div>
              </div>
              <button class="btn btn-soft btn-icon" onclick="speakText('${char}')" title="اسمع صوت الحرف">
                🔊
              </button>
            </div>

            <!-- Progress bar for current letter -->
            <div class="progress-track" style="margin-bottom:20px;">
              <div class="progress-fill" style="width: ${score}%;"></div>
            </div>

            <!-- Tabs row -->
            <div class="nav-tabs">
              ${tabs.map(t => `
                <button class="tab-pill ${state.activeLessonTab === t.id ? 'active' : ''}" onclick="setLessonTab('${t.id}')">
                  ${t.title}
                </button>
              `).join('')}
            </div>

            <!-- Dynamic Tab Content Mount -->
            <div id="lessonTabContent"></div>
          </div>
        </div>
      `;

      document.getElementById('appMount').innerHTML = html;
      renderLessonContent();
    }

    function renderLessonContent() {
      const container = document.getElementById('lessonTabContent');
      if (!container) return;

      const char = state.activeLetter;
      const data = LETTER_DATA[char];
      const tab = state.activeLessonTab;

      // 1. ALL ACTIVITIES OVERVIEW
      if (tab === 'all') {
        container.innerHTML = `
          <div class="big-char-card">
            <div style="font-size:14px; font-weight:800; color:var(--text-sub); margin-bottom:6px;">الحرف الكبير والصغير</div>
            <div class="big-letter-text">${char} ${char.toLowerCase()}</div>
            <button class="btn btn-soft" onclick="speakText('${char}')" style="margin-top:8px;">
              🔊 اسمع صوت الحرف مع مس أسماء
            </button>
          </div>

          <h3 style="text-align:right; font-size:18px; margin:20px 0 12px;">أنشطة حرف ${char}:</h3>
          <div class="task-item" onclick="setLessonTab('sound')">
            <div class="task-icon">🔊</div>
            <div class="task-info">
              <strong>اسمع صوت الحرف والكلمات</strong>
              <small>استمع للنطق الصحيح وشاهد صور الكلمات</small>
            </div>
            <button class="btn btn-soft">ابدأ ➔</button>
          </div>
          <div class="task-item" onclick="setLessonTab('trace')">
            <div class="task-icon">✍️</div>
            <div class="task-info">
              <strong>تتبّع واكتب الحرف</strong>
              <small>امشي على النقط واكتب حرف ${char}</small>
            </div>
            <button class="btn btn-soft">ابدأ ➔</button>
          </div>
          <div class="task-item" onclick="setLessonTab('quiz')">
            <div class="task-icon">🎧</div>
            <div class="task-info">
              <strong>تحدي اسمع واختار</strong>
              <small>اسمع الصوت واضغط على الحرف الصحيح</small>
            </div>
            <button class="btn btn-soft">ابدأ ➔</button>
          </div>
          <div class="task-item" onclick="setLessonTab('word')">
            <div class="task-icon">🧩</div>
            <div class="task-info">
              <strong>تكوين الكلمة</strong>
              <small>اكمل الحرف الناقص في الكلمة المصورة</small>
            </div>
            <button class="btn btn-soft">ابدأ ➔</button>
          </div>
          <div class="task-item" onclick="setLessonTab('color')">
            <div class="task-icon">🎨</div>
            <div class="task-info">
              <strong>لوّن الحرف وضع ملصقات</strong>
              <small>لوحة رسم وإبداع حرة للأطفال</small>
            </div>
            <button class="btn btn-soft">ابدأ ➔</button>
          </div>
        `;
        return;
      }

      // 2. SOUND & FLASHCARDS
      if (tab === 'sound') {
        container.innerHTML = `
          <div class="big-char-card">
            <div style="font-size:46px;">🔊</div>
            <h3 style="margin:8px 0; font-size:22px;">اسمع وكرّر صوت حرف ${char}</h3>
            <p style="color:var(--text-sub); font-size:14px; margin-bottom:16px;">
              دوس على زر الصوت واسمع النطق الجميل، وقول مع مس أسماء بصوت عالي! 🌟
            </p>
            <button class="btn btn-pink" onclick="speakText('${char}')" style="font-size:16px; padding:12px 28px;">
              ▶️ اسمع صوت الحرف: ${char}
            </button>
          </div>

          <h3 style="text-align:right; font-size:18px; margin:24px 0 12px;">كلمات تبدأ بحرف ${char}:</h3>
          <div class="flashcards-row">
            ${data.words.map(w => `
              <div class="flashcard" onclick="speakText('${w.en}')">
                <span class="flashcard-audio-hint">🔊</span>
                <div class="flashcard-icon">${w.icon}</div>
                <div class="flashcard-en">${w.en}</div>
                <div class="flashcard-ar">${w.ar}</div>
              </div>
            `).join('')}
          </div>

          <div style="margin-top:24px;">
            <button class="btn btn-green" onclick="recordActivityCompletion('سماع صوت الحرف وكلماته')">
              خلصت وسَمّعت لمس أسماء! ⭐
            </button>
          </div>
        `;
        return;
      }

      // 3. TRACING PAD
      if (tab === 'trace') {
        container.innerHTML = `
          <h3 style="margin:4px 0 8px; font-size:20px;">امشي على خط الحرف ✍️</h3>
          <p style="color:var(--text-sub); font-size:14px; margin-bottom:12px;">
            ابدأ من <span style="color:var(--accent-mint); font-weight:800;">النقطة الخضراء</span> وامشي بصباعك أو بالماوس على شكل الحرف!
          </p>

          <div class="trace-wrapper">
            <div class="trace-guide-char">${char}</div>
            <div class="trace-dot-start"></div>
            <canvas id="traceCanvas" class="trace-canvas"></canvas>
          </div>

          <div style="display:flex; gap:10px; justify-content:center; margin-top:16px;">
            <button class="btn btn-light" onclick="clearTracingCanvas()">
              🔄 امسح وجرب تاني
            </button>
            <button class="btn btn-green" onclick="recordActivityCompletion('كتابة وتتبّع الحرف')">
              كتبت الحرف بخط جميل! ⭐
            </button>
          </div>
        `;
        setTimeout(initTracingCanvas, 50);
        return;
      }

      // 4. LISTENING QUIZ
      if (tab === 'quiz') {
        // Generate 3 choices including the current char
        const otherChars = ALPHABET.filter(c => c !== char);
        const shuffled = [char, otherChars[Math.floor(Math.random() * otherChars.length)], otherChars[(Math.floor(Math.random() * otherChars.length) + 1) % otherChars.length]].sort(() => Math.random() - 0.5);

        container.innerHTML = `
          <div style="font-size:52px; margin-bottom:8px;">🎧</div>
          <h3 style="margin:4px 0 8px; font-size:22px;">اسمع واختار الحرف الصح!</h3>
          <p style="color:var(--text-sub); font-size:14.5px; margin-bottom:18px;">
            اضغط على زر الاستماع، وبعدها اضغط على الحرف اللي سمعته يا بطل!
          </p>

          <button class="btn btn-pink" onclick="speakText('${char}')" style="margin-bottom:18px; padding:12px 24px;">
            🔊 اسمع صوت الحرف تاني
          </button>

          <div class="quiz-options">
            ${shuffled.map(c => `
              <button class="quiz-btn" onclick="checkQuizAnswer('${c}', '${char}')">
                ${c}
              </button>
            `).join('')}
          </div>
        `;
        // Speak automatically
        setTimeout(() => speakText(char), 300);
        return;
      }

      // 5. WORD BUILDER
      if (tab === 'word') {
        const q = data.quizWord;
        container.innerHTML = `
          <div style="font-size:60px; margin-bottom:6px;">${q.icon}</div>
          <h3 style="margin:4px 0 8px; font-size:22px;">كوّن كلمة ${q.word}</h3>
          <p style="color:var(--text-sub); font-size:14px; margin-bottom:14px;">
            اختار الحرف الناقص في بداية الكلمة:
          </p>

          <div class="word-slot-box">
            <span id="wordBlankSpan" class="word-slot-blank">_</span>${q.word.slice(1)}
          </div>

          <div class="quiz-options">
            ${q.choices.map(c => `
              <button class="quiz-btn" onclick="checkWordAnswer('${c}', '${q.missing}')">
                ${c}
              </button>
            `).join('')}
          </div>
        `;
        return;
      }

      // 6. COLORING & STICKERS
      if (tab === 'color') {
        const colors = ['#ff6584', '#ffbe3d', '#38c88f', '#4f80e1', '#8f6cf7', '#2d3436'];
        const stamps = ['⭐', '🌸', '🌈', '🚀', '🍎', '🐾'];

        container.innerHTML = `
          <h3 style="margin:4px 0 6px; font-size:20px;">يلا نلوّن حرف ${char} ونحط ملصقات 🎨</h3>
          <p style="color:var(--text-sub); font-size:13.5px; margin-bottom:10px;">
            اختار لونك المفضل، أو اختار ملصق واضغط على اللوحة عشان تحطه!
          </p>

          <!-- Palette -->
          <div class="palette-row">
            ${colors.map((c, i) => `
              <button class="palette-dot ${i === 0 ? 'active' : ''}" style="background:${c};" onclick="selectColor('${c}', this)"></button>
            `).join('')}
          </div>

          <!-- Stamps -->
          <div class="stamp-row">
            ${stamps.map(s => `
              <button class="stamp-btn" onclick="selectStamp('${s}', this)">${s}</button>
            `).join('')}
          </div>

          <div style="display:flex; justify-content:center; margin:10px 0;">
            <canvas id="paintCanvas" style="width:100%; max-width:440px; height:240px; border-radius:20px; border:2px solid var(--border-subtle); box-shadow:var(--shadow-sm); touch-action:none;"></canvas>
          </div>

          <div style="display:flex; gap:10px; justify-content:center; margin-top:14px;">
            <button class="btn btn-light" onclick="initColoringCanvas(); showToast('تم مسح اللوحة! ابدأ التلوين من جديد 🎨');">
              🔄 امسح وابدأ من جديد
            </button>
            <button class="btn btn-green" onclick="recordActivityCompletion('تلوين الحرف وإبداع')">
              خلصت التلوين واللوحة جاهزة! 🌟
            </button>
          </div>
        `;
        setTimeout(initColoringCanvas, 50);
        return;
      }
    }

    /* ---------------- Teacher Dashboard ---------------- */
    function renderTeacherDashboard() {
      const totalStudents = state.students.length;
      const totalStars = state.students.reduce((acc, s) => acc + (s.stars || 0), 0);

      const html = `
        <!-- Hero Banner for Miss Asmaa -->
        <section class="hero-card" style="background: linear-gradient(125deg, #fdf4f7 0%, #f3efff 60%, #eaf1ff 100%);">
          <div class="hero-info">
            <div class="hero-badge-row">
              <span class="hero-pill" style="background:white; color:var(--accent-pink);">🌸 أهلاً بحضرتك يا مس أسماء</span>
              <span class="hero-pill">🏫 فصل أبطال الروضة والابتدائي</span>
            </div>
            <h1>لوحة المعلمة والإشراف 👩‍🏫</h1>
            <p>
              من هنا تقدري تتابعي مستوى تقدم كل طفل، وتتحكمي في شروط فتح الحروف، وتراجعي المحتوى والأصوات، وتهدي أطفالك نجوم تشجيعية فورية.
            </p>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn btn-pink" onclick="openAddStudentModal()">
                ＋ إضافة طفل جديد
              </button>
              <button class="btn btn-soft" onclick="openRuleModal()">
                🔐 ضبط شرط فتح الحروف (${state.passThreshold}%)
              </button>
            </div>
          </div>
          <div class="hero-art-side">
            <div class="floating-mascot">👩‍🏫</div>
            <div style="font-size:55px;">🌷📚</div>
          </div>
        </section>

        <!-- Stats row -->
        <div class="teacher-stat-grid" style="margin-top:24px;">
          <div class="teacher-stat-card">
            <span style="font-size:26px;">👧👦</span>
            <span class="val">${totalStudents}</span>
            <span class="lbl">إجمالي الأطفال المسجلين</span>
          </div>
          <div class="teacher-stat-card">
            <span style="font-size:26px;">⭐</span>
            <span class="val">${totalStars}</span>
            <span class="lbl">نجوم التميز الممنوحة</span>
          </div>
          <div class="teacher-stat-card">
            <span style="font-size:26px;">🎯</span>
            <span class="val">${state.passThreshold}%</span>
            <span class="lbl">نسبة اجتياز الحرف</span>
          </div>
          <div class="teacher-stat-card">
            <span style="font-size:26px;">📚</span>
            <span class="val">26</span>
            <span class="lbl">حروف اللغة الإنجليزية</span>
          </div>
        </div>

        <div class="grid">
          <!-- Student Follow-up Column -->
          <section class="card s-8">
            <div class="card-head">
              <h2 class="card-title">👧 متابعة شطارة وتقدم الأطفال</h2>
              <button class="btn btn-soft" onclick="openAddStudentModal()">＋ طفل جديد</button>
            </div>

            ${state.students.map(st => {
              const keys = Object.keys(st.progress);
              const avg = keys.length ? Math.round(keys.reduce((a, k) => a + (st.progress[k] || 0), 0) / keys.length) : 0;
              return `
                <div class="kid-row-card">
                  <div class="kid-avatar">${st.avatar}</div>
                  <div style="flex:1; min-width:0;">
                    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
                      <div>
                        <strong style="font-size:16px;">${st.name}</strong>
                        <small style="color:var(--text-sub); margin-right:8px;">(الحروف المفتوحة: ${st.unlocked.join('، ')})</small>
                      </div>
                      <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-weight:900; color:var(--accent-gold);">⭐ ${st.stars}</span>
                        <span style="font-weight:800; font-size:14px; color:var(--primary);">${avg}%</span>
                      </div>
                    </div>
                    <div class="progress-track">
                      <div class="progress-fill" style="width:${avg}%;"></div>
                    </div>
                  </div>
                  <div style="display:flex; gap:6px;">
                    <button class="btn btn-light btn-icon" onclick="rewardStudentStar('${st.id}')" title="إهداء نجمة تشجيعية">
                      ⭐
                    </button>
                    <button class="btn btn-soft" style="padding:6px 12px; font-size:12.5px;" onclick="switchStudent('${st.id}'); toggleRole();">
                      تجربة كطالب
                    </button>
                  </div>
                </div>
              `;
            }).join('')}
          </section>

          <!-- Quick Actions & Teacher Tools -->
          <section class="card s-4">
            <div class="card-head">
              <h2 class="card-title">⚡ اختصارات وإعدادات</h2>
            </div>

            <div class="task-item" onclick="openAddStudentModal()" style="cursor:pointer;">
              <div class="task-icon">👧</div>
              <div class="task-info">
                <strong>إضافة طفل جديد</strong>
                <small>تسجيل تلميذ جديد في الفصل</small>
              </div>
              <span>＋</span>
            </div>

            <div class="task-item" onclick="openRuleModal()" style="cursor:pointer;">
              <div class="task-icon">🔐</div>
              <div class="task-info">
                <strong>شرط فتح الحروف</strong>
                <small>النسبة الحالية: ${state.passThreshold}%</small>
              </div>
              <span class="tag-badge done">${state.passThreshold}%</span>
            </div>

            <div style="padding:16px; background:#fffbf0; border:1px solid #ffe9b8; border-radius:18px; margin-top:16px; font-size:13px; line-height:1.7; color:#856404;">
              💡 <strong>نصيحة مس أسماء:</strong><br>
              الأطفال في هذا السن يتعلمون أسرع عند ربط الحرف بالصوت والصورة، ونظام النجوم يزيد من شغفهم لإكمال الحروف بالتتابع!
            </div>
          </section>

          <!-- Letters & Curriculum Manager -->
          <section class="card s-12">
            <div class="card-head">
              <h2 class="card-title">📖 إدارة محتوى الحروف والأنشطة</h2>
              <span style="font-size:13px; color:var(--text-sub); font-weight:700;">اضغطي على أي حرف لمعاينته وتعديله</span>
            </div>

            <div class="letters-shelf">
              ${ALPHABET.slice(0, 12).map(char => `
                <button class="letter-btn" onclick="openManageLetterModal('${char}')">
                  <span class="char-display">${char} ${char.toLowerCase()}</span>
                  <span class="status-text" style="color:var(--primary);">إعدادات الحرف ⚙️</span>
                </button>
              `).join('')}
            </div>
          </section>
        </div>
      `;

      document.getElementById('appMount').innerHTML = html;
    }

    /* ==========================================================================
       11. INITIALIZATION
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      render();
    });
    render();
  </script>
</body>
</html>
